# ==========================================================
# 🪑 NGINX DO SALÃO
# ==========================================================
# Duas funções:
#   1. Servir os arquivos do React (pasta dist/ gerada no build)
#   2. Repassar as chamadas /api/ para a cozinha (backend)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy: tudo que começa com /api/ vai para a cozinha.
    # "backend" é o NOME DO SERVIÇO no docker-compose.yml:
    # o DNS interno do Docker traduz esse nome para o IP do container.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React (SPA): se o arquivo não existir, devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
